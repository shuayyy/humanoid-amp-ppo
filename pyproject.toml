[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab_g1"
version = "0.1.0"
license = "Apache-2.0"
description = "Humanoid Mimic: AMP-PPO and SuperMimic for the Unitree G1"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mjlab",
    "onnxruntime",
    "rsl-rl-lib",
    "pynput",
    "scipy",
]

[project.entry-points."mjlab.tasks"]
mjlab_g1 = "mjlab_g1.tasks"

[project.scripts]
train = "mjlab_g1.scripts.train:main"
play = "mjlab_g1.scripts.play:main"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4

[tool.uv]
# mjlab sources mujoco from its nightly index (py.mujoco.org), which only
# serves dev builds, and loosens its own `mujoco~=3.8.0` floor with this same
# override in its [tool.uv]. uv does NOT inherit override-dependencies from
# git dependencies, so we must mirror it here or resolution fails with
# "only mujoco>=3.9.0.dev... is available".
override-dependencies = ["mujoco>=3.8.0.dev0"]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "v1.4.0" }
rsl-rl-lib = { path = "rsl_rl", editable = true }
